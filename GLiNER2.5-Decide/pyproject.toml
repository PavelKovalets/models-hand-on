[project]
name = "gliner2-5-decide"
version = "0.1.0"
description = "Hands-on with Fastino's GLiNER2.5-Decide schema classifiers (Decide-1B by default, 340M for comparison)."
requires-python = ">=3.12,<3.13"  # gliner2 is tested on 3.10-3.12
dependencies = [
    "gliner2[local]>=2.1,<3",
    "torch>=2.14",  # direct dependency so the CUDA index below applies
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]  # runs in WSL only

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
